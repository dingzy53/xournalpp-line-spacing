# Publishes a release when a version tag is pushed: run the tests (Lua 5.4 and 5.5), then
# attach LineSpacing.zip (the plugin folder, ready to unzip into the plugins folder).
# The tag must equal version= in LineSpacing/plugin.ini, with no "v" prefix.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches plugin.ini
        run: |
          version=$(sed -n 's/^version=//p' LineSpacing/plugin.ini | tr -d '\r')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in LineSpacing/plugin.ini"
            exit 1
          fi

      - name: Run unit and GTK smoke tests (Lua 5.4)
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua-lgi xvfb
          luac5.4 -p LineSpacing/*.lua LineSpacing/ui/*.lua tests/*.lua
          lua5.4 tests/run.lua
          xvfb-run -a lua5.4 tests/gtk_smoke.lua

      - name: Build Lua 5.5.1
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.5.1.tar.gz | tar -xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.5.1" linux

      - name: Check syntax and run tests (Lua 5.5)
        run: |
          lua55="$RUNNER_TEMP/lua-5.5.1/src"
          "$lua55/luac" -p LineSpacing/*.lua LineSpacing/ui/*.lua tests/*.lua
          "$lua55/lua" tests/run.lua

      - name: Package the plugin folder
        run: zip -r LineSpacing.zip LineSpacing

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LineSpacing.zip --title "$GITHUB_REF_NAME" --generate-notes
